<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 記事の二段組。左が日付の柱で上で止まり、右が本文の柱で板の下から抜ける。
       本文の柱を横切る細い罫は時刻ブロックの区切り（.prose time::after にあたる）で、
       これが左右の壁に触れることで四角が二つに割れ、「日」に見える。
       壁から離すと割れないので、太さは落としても幅は通しのままにする。

       罫は柱より左右に 1 ずつ長い（14→27.5 で、柱は 15→26.5）。両端を柱と同じ座標で
       止めると、柱の縁の半端な画素を罫も同じだけしか覆えず、消しきれなかった白が
       墨の中に一画素の縦線として残る（180px で R=38 対 23）。周りは同じ墨なので、
       はみ出したぶんは見えない。

       角丸 5.5 は見た目で選んだ数字ではない。板の下辺が直線でいられるのは x が 32-rx まで
       （そこから先は角の弧）で、下へ抜ける柱の右端はちょうど 26.5 = 32-5.5。
       rx をこれより大きくすると角の弧が柱を斜めに削り、先細りの白い楔が下辺に残る
       （rx=7 だと 512px で 16 画素ぶん出る）。柱の右端を動かすときは rx も一緒に動かす。 -->
  <clipPath id="t"><rect width="32" height="32" rx="5.5"/></clipPath>
  <rect width="32" height="32" rx="5.5" fill="#17181A"/>
  <g clip-path="url(#t)">
    <rect x="5" y="7" width="6.5" height="8" rx="1.3" fill="#FFFFFF"/>
    <rect x="15" y="7" width="11.5" height="27" rx="1.3" fill="#FFFFFF"/>
    <rect x="14" y="18.1" width="13.5" height="2.2" fill="#17181A"/>
  </g>
</svg>
